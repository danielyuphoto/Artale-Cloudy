<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudy 公會專屬 - 點數商品折溢價計算表</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            /* 神木村背景 */
            background-image: url('神木村.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333; 
            padding: 20px 20px 40px 20px; 
            max-width: 1100px; 
            margin: auto; 
        }
        
        /* 毛玻璃共用樣式 (讓背景透出高質感模糊) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }
        
        /* 標題與對稱勳章區塊 */
        .header-container { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 25px; 
            margin-bottom: 25px; 
            padding: 20px; 
        }
        .header-container img.badge { 
            height: 100px; 
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25)); /* 讓去背圖有立體感 */
        } 
        .header-container h2 { 
            margin: 0; 
            color: #2c3e50; 
            font-size: 28px; 
            font-weight: 800;
            text-align: center; 
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }
        
        /* 參數控制區塊 */
        .controls { 
            padding: 20px; 
            margin-bottom: 25px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .controls-row { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
        .controls label { font-weight: bold; display: flex; align-items: center; gap: 5px; color: #1a252f; }
        input[type="number"] { padding: 6px 10px; width: 85px; border: 1px solid #bdc3c7; border-radius: 6px; background: rgba(255, 255, 255, 0.9); font-size: 15px; outline: none; transition: 0.2s; }
        input[type="number"]:focus { border-color: #3498db; box-shadow: 0 0 5px rgba(52, 152, 219, 0.5); }
        .vip-note { font-size: 0.95em; color: #c0392b; font-weight: bold; margin-left: 5px; }
        
        /* 表格區塊 */
        table { width: 100%; border-collapse: collapse; overflow: hidden; }
        th, td { padding: 14px 12px; text-align: center; border-bottom: 1px solid rgba(0,0,0,0.08); }
        th { background-color: rgba(44, 62, 80, 0.95); color: #fff; font-size: 16px; letter-spacing: 1px; }
        tr:hover { background-color: rgba(255, 255, 255, 0.6); }
        .buy-ah { color: #27ae60; font-weight: bold; }
        .buy-wc { color: #2980b9; font-weight: bold; }
        .profit-good { color: #c0392b; font-weight: bold; }
        .profit-bad { color: #7f8c8d; }

        /* 底部公會名牌區塊 */
        .footer-container {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }
        .footer-container img.nameplate {
            height: 120px; /* 放大名牌 */
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.25));
            transition: transform 0.3s ease; /* 加入動畫過渡效果 */
            cursor: pointer;
        }
        .footer-container img.nameplate:hover {
            transform: scale(1.05); /* 滑鼠游標移上時微放大 */
        }
    </style>
</head>
<body>

    <!-- 圖片與標題區塊 (左右對稱勳章) -->
    <div class="header-container glass-panel">
        <img src="公會勳章截圖(去背).png" alt="Cloudy公會勳章(左)" class="badge">
        <h2>Cloudy 公會專屬<br>點數商品折溢價計算表</h2>
        <img src="公會勳章截圖(去背).png" alt="Cloudy公會勳章(右)" class="badge">
    </div>

    <!-- 參數控制區塊 -->
    <div class="controls glass-panel">
        <div class="controls-row" style="border-bottom: 1px dashed rgba(0,0,0,0.2); padding-bottom: 15px;">
            <label>💰 儲值基準： 
                <input type="number" id="twdCost" value="1830" oninput="calculate()"> 台幣 = 
                <input type="number" id="wcAmount" value="13200" oninput="calculate()"> WC
            </label>
            <label>📈 今日 1 億楓幣 = <input type="number" id="twdRate" value="650" oninput="calculate()"> 台幣</label>
        </div>
        <div class="controls-row">
            <label>
                <input type="checkbox" id="vipCheck" style="width:18px; height:18px; cursor: pointer;" onchange="calculate()"> 
                👑 擁有拍賣場VIP (手續費降至3%)
            </label>
            <span id="vipText" class="vip-note"></span>
        </div>
    </div>

    <!-- 表格區塊 -->
    <div class="glass-panel">
        <table>
            <thead>
                <tr>
                    <th>商城道具</th>
                    <th>WC 單價</th>
                    <th>理論點數成本<br>(萬楓幣)</th>
                    <th>目前拍賣行情<br>(萬楓幣)</th>
                    <th>買來自用建議</th>
                    <th>用WC購買後賣出<br>(萬楓幣)</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- 內容由 JavaScript 動態生成 -->
            </tbody>
        </table>
    </div>

    <!-- 底部名牌區塊 -->
    <div class="footer-container">
        <img src="公會名牌截圖(去背).png" alt="公會名牌(去背)" class="nameplate">
    </div>

    <script>
        // 依照指定順序排列的道具清單
        const items = [
            { name: "飄雪結晶 (雪花)", wc: 300/11, ah: 40 },
            { name: "突襲額外獎勵票券", wc: 1200/7, ah: 370 },
            { name: "高級瞬移之石", wc: 400/11, ah: 81 },
            { name: "凍結加持器", wc: 450/11, ah: 97 },
            { name: "神秘符咒", wc: 450/11, ah: 92 },
            { name: "神秘背包", wc: 250, ah: 520 },
            { name: "AP初始化卷軸", wc: 400, ah: 920 },
            { name: "SP初始化卷軸", wc: 300, ah: 679 },
            { name: "寵物", wc: 1600, ah: 3500 }
        ];

        function calculate() {
            // 讀取儲值基準與匯率
            const twdCost = parseFloat(document.getElementById('twdCost').value) || 1830;
            const wcAmount = parseFloat(document.getElementById('wcAmount').value) || 13200;
            const wcCostTWD = twdCost / wcAmount; 

            const twdRate = parseFloat(document.getElementById('twdRate').value) || 1;
            const isVip = document.getElementById('vipCheck').checked;
            const tax = isVip ? 0.03 : 0.05;
            
            // 計算 VIP 回本門檻 (6400 WC 換算)
            const vipCostTWD = 6400 * wcCostTWD;
            const vipCostMeso = vipCostTWD * (10000 / twdRate); 
            const breakEvenMeso = (vipCostMeso / 0.02) / 10000; 
            
            // 更新介面上的 VIP 提示文字
            document.getElementById('vipText').innerText = 
                `※ 90天VIP成本為6400 WC，以目前匯率需賣出約 ${breakEvenMeso.toFixed(2)} 億楓幣方可回本`;

            // 產出表格內容
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            items.forEach((item, index) => {
                const theoryMeso = (item.wc * wcCostTWD) * (10000 / twdRate);
                
                const tr = document.createElement('tr');
                
                let buyAdvice = '';
                if (item.ah < theoryMeso) {
                    buyAdvice = `<span class="buy-ah">✅ 用楓幣拉拍賣</span>`;
                } else {
                    buyAdvice = `<span class="buy-wc">💎 直接扣 WC 買</span>`;
                }

                const sellNet = item.ah * (1 - tax);
                const profit = sellNet - theoryMeso;
                let profitHtml = '';
                if (profit > 0) {
                    profitHtml = `<span class="profit-good">賺 ${profit.toFixed(1)} 萬</span>`;
                } else {
                    profitHtml = `<span class="profit-bad">虧 ${Math.abs(profit).toFixed(1)} 萬</span>`;
                }

                tr.innerHTML = `
                    <td>${item.name}</td>
                    <td>${item.wc.toFixed(1)}</td>
                    <td>${theoryMeso.toFixed(1)}</td>
                    <td><input type="number" value="${item.ah}" style="width: 75px;" onchange="updateAH(${index}, this.value)"></td>
                    <td>${buyAdvice}</td>
                    <td>${profitHtml}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 當拍賣場價格被修改時更新資料
        function updateAH(index, newValue) {
            items[index].ah = parseFloat(newValue) || 0;
            calculate();
        }

        // 網頁載入時立刻執行計算
        calculate();
    </script>
</body>
</html>
