<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artale Cloudy 公會小窩</title>
    <!-- 載入 Zen Maru Gothic 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
    <style>
        /* 全局字體：華康手札體 */
        body { 
            font-family: '華康手札體 Std W7 OpenType', 'DFHandwriting-W7', 'DFPHandwriting-W7', 'Segoe UI', 'Microsoft JhengHei', sans-serif; 
            /* 神木村背景 */
            background-image: url('神木村.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #333; 
            padding: 20px 10px 40px 10px; 
            max-width: 1450px; 
            margin: auto; 
        }
        
        /* 毛玻璃共用樣式 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }
        
        /* 標題與對稱勳章區塊 */
        .header-container { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 20px; 
            margin-bottom: 40px; 
            padding: 10px; 
            margin-top: 20px;
            position: relative; /* 固定層級避免特效干擾下方 */
            z-index: 10;
        }
        .header-container img.badge { 
            height: 90px; 
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25)); 
            transition: transform 0.3s ease; 
            cursor: pointer;
            z-index: 5;
        } 
        .header-container img.badge:hover { transform: scale(1.1); }
        
        /* === 純 CSS 繪製：柔邊雲朵特效外框 === */
        .cloud-title-wrapper {
            position: relative;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 80px; 
            padding: 25px 50px; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1), 0 0 35px 20px rgba(255, 255, 255, 0.85);
            z-index: 1;
        }
        .cloud-title-wrapper::before,
        .cloud-title-wrapper::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            z-index: -1;
            box-shadow: 0 0 30px 15px rgba(255, 255, 255, 0.8);
            pointer-events: none; /* 讓隱形的雲朵特效不會阻擋滑鼠點擊 */
        }
        .cloud-title-wrapper::before {
            width: 100px;
            height: 100px;
            top: -40px;
            left: 15%;
        }
        .cloud-title-wrapper::after {
            width: 130px;
            height: 130px;
            top: -55px;
            right: 15%;
        }
        .cloud-title-wrapper h2 { 
            margin: 0; 
            text-align: center; 
            text-shadow: 2px 2px 4px rgba(255,255,255,0.9);
            position: relative;
            z-index: 2;
        }
        /* 標題英文字母草書設定 */
        .title-cursive {
            font-family: 'Brush Script MT', 'STXingkai', cursive;
            font-size: 42px;
            color: #2c3e50;
            margin-right: 8px;
        }
        /* 標題中文 Zen Maru Gothic 設定 */
        .title-zen {
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 38px;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: 2px;
        }

        /* 左右排版容器 */
        .layout-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            position: relative;
            z-index: 20;
        }

        /* 左側導覽列 */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px;
            width: 220px; 
            flex-shrink: 0;
            position: sticky;
            top: 20px; 
            z-index: 9999; /* 超高層級，絕對不會被其他區塊覆蓋或擋住點擊 */
        }
        .sidebar button {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 18px; 
            font-weight: bold;
            color: #2c3e50;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            font-family: inherit; 
        }
        .sidebar button:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateX(5px); 
        }
        .sidebar button.active {
            background: #3498db;
            color: white;
            border-color: #2980b9;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
            transform: translateX(5px);
        }

        /* 右側主要內容區 */
        .main-content {
            flex: 1;
            min-width: 0; 
        }

        /* 頁籤內容切換設定 */
        .tab-content {
